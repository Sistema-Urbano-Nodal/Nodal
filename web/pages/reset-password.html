<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" />
  <title>Reset your password · NODAL</title>

  <link rel="preload" href="assets/fonts/montserrat-v31-latin-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="fonts.css?v=20260911b" />
  <link rel="stylesheet" href="recovery.css?v=20260907c" />

  <script defer src="i18n.js?v=20260911c"></script>
  <script defer src="recovery-i18n.js?v=20260907c"></script>
  <script defer src="password-recovery.js?v=20260908b"></script>
</head>
<body data-page="password-recovery">
  <header class="recovery-header">
    <a class="recovery-brand" href="index.html"><img src="assets/nodal-wordmark.webp" alt="NODAL" width="150" height="42" /></a>
    <div class="recovery-languages" role="group" aria-label="Language">
      <button type="button" class="lang-btn" data-lang="en" aria-label="English">EN</button>
      <button type="button" class="lang-btn" data-lang="es" aria-label="Español">ES</button>
      <button type="button" class="lang-btn" data-lang="pt" aria-label="Português">PT</button>
    </div>
  </header>
  <main class="recovery-layout">
    <div class="recovery-map" aria-hidden="true">
      <svg viewBox="0 0 480 620" fill="none" focusable="false">
        <g class="map-blocks">
          <path d="M-30 24H121V148H-30ZM146 24H262V148H146ZM287 24H426V148H287ZM-30 173H121V285H-30ZM146 173H262V285H146ZM287 173H426V285H287ZM451 173H505V285H451ZM-30 310H121V454H-30ZM146 310H262V454H146ZM287 310H426V454H287ZM451 310H505V454H451ZM-30 479H121V620H-30ZM146 479H262V620H146ZM287 479H426V620H287Z" />
        </g>
        <path class="map-park" d="M287 310H426V454H287Z" />
        <path class="map-route-muted" d="M-20 160H133V467H505M-20 297H439V-20M274 640V160H505" />
        <path class="map-route" d="M-20 467H133V297H274V160H439V-20" />
        <g class="map-stations"><circle cx="133" cy="467" r="7"/><circle cx="133" cy="297" r="7"/><circle cx="274" cy="297" r="7"/><circle cx="439" cy="160" r="7"/></g>
        <circle class="map-destination-ring" cx="274" cy="160" r="26" />
        <circle class="map-destination" cx="274" cy="160" r="11" />
      </svg>
    </div>
    <section class="recovery-content" aria-labelledby="recoveryTitle">
      <div class="recovery-form-area">
        <h1 id="recoveryTitle" data-recovery-text="requestTitle">Reset your password</h1>
        <form id="recoveryRequest">
          <p class="recovery-intro" data-recovery-text="requestIntro">Enter the email you used for NODAL. We'll send you a link to choose a new password.</p>
          <label for="recoveryEmail" data-recovery-text="email">Email</label>
          <input id="recoveryEmail" name="email" type="email" autocomplete="email" autocapitalize="none" spellcheck="false" maxlength="254" aria-describedby="recoveryBrowserNote" required />
          <p class="recovery-note" id="recoveryBrowserNote" data-recovery-text="browserNote">Open the latest link in this same browser as soon as it arrives.</p>
          <button type="submit" class="recovery-submit" data-recovery-text="request">Send reset link</button>
        </form>
        <form id="recoveryReset" hidden>
          <p class="recovery-intro" id="recoveryPasswordNote" data-recovery-text="newIntro">Use a new password with 8–160 characters. After saving it, sign in again.</p>
          <label for="recoveryPassword" data-recovery-text="password">New password</label>
          <input id="recoveryPassword" name="new-password" type="password" autocomplete="new-password" minlength="8" maxlength="160" aria-describedby="recoveryPasswordNote" required />
          <label for="recoveryConfirm" data-recovery-text="confirm">Confirm new password</label>
          <input id="recoveryConfirm" name="confirm-password" type="password" autocomplete="new-password" minlength="8" maxlength="160" required />
          <button type="submit" class="recovery-submit" data-recovery-text="save">Save new password</button>
        </form>
        <p id="recoveryMessage" role="status" aria-live="polite" hidden></p>
        <div class="recovery-actions">
          <a href="login.html" data-recovery-text="signIn">Back to sign in</a>
          <button type="button" id="recoveryAnother" data-recovery-text="another" hidden>Request another link</button>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
