<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" />
  <title>Accept your course invitation · NODAL</title>
  <script src="accept-invitation.js?v=20260907a"></script>
  <link rel="preload" href="assets/fonts/montserrat-v31-latin-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="fonts.css?v=20260911b" />
  <link rel="stylesheet" href="recovery.css?v=20260907c" />

  <script defer src="invitation-i18n.js?v=20260907a"></script>
</head>
<body data-page="course-invitation">
  <header class="recovery-header">
    <a class="recovery-brand" href="index.html"><img src="assets/nodal-wordmark.webp" alt="NODAL" width="150" height="42" /></a>
    <div class="recovery-languages" role="group" aria-label="Language">
      <button type="button" class="lang-btn" data-lang="en" aria-label="English">EN</button>
      <button type="button" class="lang-btn" data-lang="es" aria-label="Español">ES</button>
      <button type="button" class="lang-btn" data-lang="pt" aria-label="Português">PT</button>
    </div>
  </header>
  <main class="recovery-layout">
    <div class="recovery-map" aria-hidden="true">
      <svg viewBox="0 0 480 620" fill="none" focusable="false">
        <g class="map-blocks">
          <path d="M-30 24H121V148H-30ZM146 24H262V148H146ZM287 24H426V148H287ZM-30 173H121V285H-30ZM146 173H262V285H146ZM287 173H426V285H287ZM451 173H505V285H451ZM-30 310H121V454H-30ZM146 310H262V454H146ZM287 310H426V454H287ZM451 310H505V454H451ZM-30 479H121V620H-30ZM146 479H262V620H146ZM287 479H426V620H287Z" />
        </g>
        <path class="map-park" d="M287 310H426V454H287Z" />
        <path class="map-route-muted" d="M-20 160H133V467H505M-20 297H439V-20M274 640V160H505" />
        <path class="map-route" d="M-20 467H133V297H274V160H439V-20" />
        <g class="map-stations"><circle cx="133" cy="467" r="7"/><circle cx="133" cy="297" r="7"/><circle cx="274" cy="297" r="7"/><circle cx="439" cy="160" r="7"/></g>
        <circle class="map-destination-ring" cx="274" cy="160" r="26" />
        <circle class="map-destination" cx="274" cy="160" r="11" />
      </svg>
    </div>
    <section class="recovery-content" aria-labelledby="invitationTitle">
      <div class="recovery-form-area">
        <h1 id="invitationTitle" data-invitation-text="title">Your place in the course</h1>
        <form id="invitationForm" novalidate hidden>
          <p class="recovery-intro" data-invitation-text="intro">Set up your NODAL account to accept your invitation. You will complete the intake form when you enter the course.</p>
          <label for="invitationName" data-invitation-text="fullName">Full name</label>
          <input id="invitationName" name="name" type="text" autocomplete="name" minlength="2" maxlength="120" required />
          <label for="invitationPassword" data-invitation-text="password">Choose a password</label>
          <input id="invitationPassword" name="new-password" type="password" autocomplete="new-password" minlength="8" maxlength="160" aria-describedby="invitationPasswordNote" required />
          <p class="recovery-note" id="invitationPasswordNote" data-invitation-text="passwordNote">Use 8–160 characters. After saving, sign in with your email and this password.</p>
          <label for="invitationConfirm" data-invitation-text="confirm">Confirm password</label>
          <input id="invitationConfirm" name="confirm-password" type="password" autocomplete="new-password" minlength="8" maxlength="160" required />
          <button type="submit" id="invitationSubmit" class="recovery-submit" data-invitation-text="accept">Accept invitation</button>
        </form>
        <p id="recoveryMessage" role="status" aria-live="polite" hidden></p>
        <div class="recovery-actions">
          <a id="invitationSignIn" href="login.html" data-invitation-text="signIn">Sign in to NODAL</a>
          <a href="reset-password.html" data-invitation-text="resetPassword">Reset an existing password</a>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
